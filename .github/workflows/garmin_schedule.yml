name: Garmin to Telegram Sync

on:
   schedule:
      # Offset from :00/:15/:30/:45 on purpose. GitHub's scheduler is
      # best-effort and those minutes are the most congested, so runs
      # queued there are the ones most often delayed or dropped.
      - cron: '7,22,37,52 * * * *'
   # Manual run, from the GitHub mobile app or the Actions tab. Leave
   # "resend" blank for a normal sync, or give a count to re-send the N most
   # recent activities even though they were sent already.
   workflow_dispatch:
      inputs:
         resend:
            description: 'Re-send the N most recent activities (blank = normal sync)'
            required: false
            default: ''
   # Fired by the Telegram bot (see bot/README.md). repository_dispatch always
   # runs the workflow from the default branch, so this must stay on main.
   repository_dispatch:
      types: [telegram-command]

# Never let two runs overlap: both would push last_activity.txt and the
# second push would be rejected.
concurrency:
   group: garmin-sync
   cancel-in-progress: false

jobs:
   sync:
      runs-on: ubuntu-latest
      # A stuck login should not sit there burning Actions minutes.
      timeout-minutes: 10
      permissions:
         contents: write

      steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Set up Python
           uses: actions/setup-python@v5
           with:
              python-version: '3.14'
              # Restores the pip download cache, which is most of this
              # job's wall time and therefore most of its billed minutes.
              cache: pip

         - name: Install dependencies
           run: pip install -r requirements.txt

         - name: Run script
           env:
              GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
              GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
              GARMIN_PASS: ${{ secrets.GARMIN_PASS }}
              BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
              CHAT_ID: ${{ secrets.CHAT_ID }}
              # Through the environment, never inlined into the script body:
              # ${{ }} interpolation in a run: block is a shell injection.
              RESEND: ${{ inputs.resend || github.event.client_payload.resend }}
           run: |
              if [ -n "$RESEND" ]; then
                 python garmin_sync.py --last "$RESEND"
              else
                 python garmin_sync.py
              fi

         - name: Save state to repository
           # always(), not the default: when a batch of catch-up activities
           # fails halfway, the ones already sent are recorded in the state
           # file and must be committed, or the next run re-sends them.
           if: always()
           run: |
              git config --global user.name "github-actions"
              git config --global user.email "actions@github.com"
              git add last_activity.txt
              # Only commit and push if the text file actually changed
              git diff --quiet && git diff --staged --quiet || (git commit -m "Update last activity ID" && git push)

         - name: Report failure to Telegram
           # Without this a broken run is invisible: the job just goes red in
           # a tab nobody watches. Most likely cause is an expired
           # GARMINTOKENS -> rerun make_garmin_token.py and update the secret.
           if: failure()
           env:
              BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
              CHAT_ID: ${{ secrets.CHAT_ID }}
              RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
           run: |
              curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                 --data-urlencode "chat_id=${CHAT_ID}" \
                 --data-urlencode "text=Garmin sync failed: ${RUN_URL}"
